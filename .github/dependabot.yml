version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # electron-vite@5 peer is vite ^5 || ^6 || ^7; unpin these once upstream adds ^8
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react@6 requires vite ^8, blocked by electron-vite@5
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react@7.37.5 caps eslint peer at ^9.7; unpin once it ships eslint 10 support
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
